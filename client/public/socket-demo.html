<!DOCTYPE html>
<html>
<head><title>Socket Test</title></head>
<body>
  <h1>Live Location Test</h1>
  <div id="log"></div>
  <script src="http://localhost:5000/socket.io/socket.io.js"></script>
  <script>
    const orderId = 'ee82a49e-f250-4dce-863c-f641ab61e616'; // your test order ID
    const deliveryToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjIxYzkxMjA5LTExNGQtNDBmMi04N2M2LTE3YTM3ZjA2ZTdhMiIsInJvbGUiOiJERUxJVkVSWV9QQVJUTkVSIiwiaWF0IjoxNzg1MDM2MjM5LCJleHAiOjE3ODUwMzcxMzl9.K1zaFA24r6EOfC2Yv-UA6kVSyzk5oepEK9IQJ5bay8I';
    const socket = io('http://localhost:5000');
    const log = document.getElementById('log');

    socket.on('connect', () => {
      log.innerHTML += '<p>Connected: ' + socket.id + '</p>';
      socket.emit('join-order-room', orderId);

      // Simulate the delivery partner sending their GPS location every 3s.
      setInterval(() => {
        socket.emit('delivery:sendLocation', {
          orderId,
          latitude: 37.4224858 + (Math.random() - 0.5) * 0.001,
          longitude: -122.0855846 + (Math.random() - 0.5) * 0.001,
          token: deliveryToken,
        });
      }, 3000);
    });

    socket.on('delivery:locationUpdated', (data) => {
      log.innerHTML += '<p><b>LOCATION UPDATE:</b> ' + JSON.stringify(data) + '</p>';
    });
  </script>
</body>
</html>
